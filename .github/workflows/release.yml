# 手动发布：跑与 ci.yml 相同的阶梯，然后把 tgz 挂到一个**正式** release（非 pre-release）。
#
# 与 pack-prerelease.yml 的区别只有一处：这里创建的 release 不带 --prerelease，且默认 --latest。
# DSH-Folk 预装用 `github:IPF-Sinon/dsh-folk-cloud` 跟最新代码；这个正式 tgz 是「git 全线路
# 都失败时」App 的兜底安装目标（钉死版本），所以要一个稳定、可直链下载的正式附件。
name: Release tarball

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/attach (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package tarball
        run: mkdir -p dist && npm pack --pack-destination ./dist

      - name: Attach tarball to a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TGZ=$(ls dist/*.tgz | head -1)
          echo "tarball: $TGZ"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease=false --latest
          else
            gh release create "$TAG" --latest \
              --title "$TAG" --notes "dsh-folk-cloud $TAG (stable tarball for DSH-Folk seed fallback)."
          fi
          gh release upload "$TAG" "$TGZ" --clobber
          # 只看真实存在的字段：GitHub 的 release JSON 已经没有 isLatest 了，带上它 gh 会直接
          # 以 "Unknown JSON field: isLatest" 退出 1 —— 附件其实已经传上去了，却把整个发布标成失败。
          # 正式/最新与否由 isDraft / isPrerelease 表达，足够守住「别把正式包发成预发布」。
          gh release view "$TAG" --json assets,isDraft,isPrerelease --jq '{isDraft, isPrerelease, assets: [.assets[].url]}'
